name: Lint and Test

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      skip-repository-check:
        description: 'Skip repository check for tests'
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      
      - name: Run flake8
        run: |
          pip install `egrep -o 'flake8==\S+' web/requirements.txt`
          flake8 web/ --config web/setup.cfg
          flake8 docker/pandoc-lambda/function/ --config web/setup.cfg
      
      - name: Run black
        run: |
          pip install `egrep -o 'black==\S+' web/requirements.txt`
          black --check --diff .
      
      - name: Run mypy
        run: |
          cd web
          pip install -r requirements.txt
          PYTHONPATH=. mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    if: inputs.skip-repository-check || github.repository == 'shaban00/h2o'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run tests
        run: |
          docker ps -a
          docker compose logs