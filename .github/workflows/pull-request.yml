name: Pull Request Validation

on:
  pull_request:
    branches: [develop, staging, prod]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch flow
        run: |
          echo "Validating pull request branch flow..."
          
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"
          
          echo "Target: $TARGET_BRANCH"
          echo "Source: $SOURCE_BRANCH"
          
          # Validate branch flow rules
          case "$TARGET_BRANCH" in
            "develop")
              echo "✅ Pull request to develop - all feature branches allowed"
              ;;
            "staging")
              if [ "$SOURCE_BRANCH" != "develop" ]; then
                echo "❌ Error: Pull requests to staging must come from develop"
                exit 1
              fi
              echo "✅ Pull request to staging from develop - valid"
              ;;
            "prod")
              if [ "$SOURCE_BRANCH" != "staging" ]; then
                echo "❌ Error: Pull requests to prod must come from staging"
                exit 1
              fi
              echo "✅ Pull request to prod from staging - valid"
              ;;
            *)
              echo "⚠️  Warning: Unknown target branch: $TARGET_BRANCH"
              ;;
          esac