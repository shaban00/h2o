name: Production - Deploy to AWS ECS

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened]

jobs:
  # Enforce branch protection: only allow merges from staging
  check-source-branch:
    name: Check Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify source branch is staging
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "❌ Error: Pull requests to prod must come from staging branch"
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ Source branch verification passed"

  lint-and-test:
    uses: ./.github/workflows/lint_test.yml
    needs: check-source-branch
    if: always() && (github.event_name == 'push' || needs.check-source-branch.result == 'success')
    with:
      python-version: '3.11'
      skip-repository-check: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: needs.lint-and-test.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build and push Docker image
        run: |
          docker build -t prod-h2o:latest .
          docker tag prod-h2o:latest prod-h2o:latest
      
      - name: Deployment summary
        run: |
          echo "🚀 **Production Deployment Complete**"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Commit: ${{ github.sha }}"
          echo "- Environment: production"
          echo "- Deploy time: $(date)"
