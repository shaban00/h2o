name: Production - Deploy to AWS

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]


jobs:
  # Only allow merges from staging
  check-source-branch:
    name: Check Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify source branch is staging
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "❌ Error: Pull requests to prod must come from staging branch"
            exit 1
          fi
          echo "✅ Source branch verification passed"

  lint-and-test:
    uses: ./.github/workflows/lint_test.yml
    needs: check-source-branch
    if: always() && (github.event_name == 'push' || needs.check-source-branch.result == 'success')

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: always() && github.event_name == 'push' && needs.lint-and-test.result == 'success'
    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PROD_AWS_REGION }}


      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build and push docker image to AWS ECR
        run: |
          docker build -t prod-h2o:latest .
          docker tag prod-h2o:latest prod-h2o:latest
